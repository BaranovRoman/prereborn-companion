# Шаблон для поля конфигурации nginx в ISPmanager.
server {
	listen 91.240.85.53:80;
	listen [::]:80;
	server_name prereborn.ru www.prereborn.ru;
	return 301 https://$host$request_uri;
}

server {
	server_name prereborn.ru www.prereborn.ru;
	ssl_certificate "/var/www/httpd-cert/www-root/prereborn.ru_le1.crtca";
	ssl_certificate_key "/var/www/httpd-cert/www-root/prereborn.ru_le1.key";
	ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
	ssl_prefer_server_ciphers on;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_dhparam /etc/ssl/certs/dhparam4096.pem;

	charset off;
	index index.html;
	disable_symlinks if_not_owner from=$root_path;
	include /etc/nginx/vhosts-includes/*.conf;
	include /etc/nginx/vhosts-resources/prereborn.ru/*.conf;
	include /etc/nginx/users-resources/www-root/*.conf;
	access_log /var/www/httpd-logs/prereborn.ru.access.log;
	error_log /var/www/httpd-logs/prereborn.ru.error.log notice;
	set $root_path /var/www/www-root/data/www/prereborn.ru;
	root $root_path;
	listen 91.240.85.53:443 ssl;
	listen [::]:443 ssl;

	gzip on;
	gzip_comp_level 5;
	gzip_disable "msie6";
	gzip_types text/plain text/css application/json application/xml application/rss+xml application/javascript image/svg+xml;

	location /api {
		proxy_pass http://127.0.0.1:5102;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /uploads/ {
		alias /var/www/www-root/data/www/prereborn.ru/apps/api/uploads/;
		expires 30d;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff";
	}

	# Independently deployed immutable runtime media (WK-67).
	location /media/ {
		alias /var/www/www-root/data/media/prereborn/;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff";
	}

	location /_next/static/ {
		proxy_pass http://127.0.0.1:5100;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location / {
		proxy_pass http://127.0.0.1:5100;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
	}
}
