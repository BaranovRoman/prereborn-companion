[package]
name = "dota-companion"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dota_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["clock"] }
# blocking + rustls-tls: outbound sender runs on a plain std::thread (no
# tokio elsewhere in this app), and rustls avoids depending on a system
# OpenSSL - see the report for why native-tls was a cross-build risk we'd
# rather not repeat after the Windows CI/llvm-rc lesson from the MVP phase.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Diagnostics ZIP export only - pure-Rust deflate backend (no system zlib/C
# toolchain needed), matches the same "no extra native build deps on Windows
# CI" constraint that drove the reqwest/rustls choice above.
zip = { version = "2", default-features = false, features = ["deflate"] }
tungstenite = "0.26"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-window-state = "2.4.1"
# WK-111 - local durable runtime (stream-session/match shadow mirror).
# "bundled" compiles SQLite from vendored C source instead of linking a
# system libsqlite3 - same "no extra native build deps on Windows CI"
# constraint that already drove the reqwest/rustls and zip/deflate choices
# above (see their comments).
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
# WK-116 - enables tauri::test::mock_app() so integration tests can drive
# real AppHandle-shaped entry points (local_runtime::handle_gsi,
# local_runtime::lifecycle::on_obs_streaming_known) end to end, the same way
# the real GSI server/OBS watcher call them - previously only the pure
# decision functions underneath them were unit-testable, which is exactly
# how a broken call-site (see the WK-116 report) went undetected. This only
# affects test builds - "test" is not enabled for the main [dependencies]
# tauri entry, so the shipped binary is unaffected.
tauri = { version = "2", features = ["test"] }

