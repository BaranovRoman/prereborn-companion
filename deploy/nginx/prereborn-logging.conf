# WK-196 - masked access log format for prereborn.ru.
#
# http-level file: map/log_format are not allowed inside `server {}`, so this
# can't live in the ISPmanager vhost field (nginx.production.conf). Install as
# /etc/nginx/conf.d/prereborn-logging.conf - see docs/production-deployment.md
# "Logs and retention".
#
# Rules are deliberately generic, not tied to exact URL shapes:
# - path comes from $uri (decoded, slashes merged), not the raw $request_uri,
#   so //overlay/<t>, /%6Fverlay/<t> or /OVERLAY/<t> are masked too; the
#   segment after overlay/ becomes [token];
# - the query string is never logged, on any URL - only a "?[redacted]"
#   marker that one was present (OAuth code/state, Steam openid.*, and any
#   future parameter);
# - Referer is reduced to its origin (scheme://host), so a token in the
#   referring page's path or query can't reach the log either.
# The nginx error log has no configurable format - see the overlay locations
# in nginx.production.conf for how it is handled.

map $uri $prereborn_log_path {
    default $uri;
    "~*^(?<prereborn_ov_prefix>/+(?:api/+stream/+)?overlay/+)[^/]+(?<prereborn_ov_rest>.*)$" "${prereborn_ov_prefix}[token]${prereborn_ov_rest}";
}

map $args $prereborn_log_args {
    "" "";
    default "?[redacted]";
}

map $http_referer $prereborn_log_referer {
    "" "-";
    "~^(?<prereborn_ref_origin>[A-Za-z][A-Za-z0-9+.-]*://[^/?#]+)" "${prereborn_ref_origin}";
    default "[redacted]";
}

# Fields and order of nginx's built-in `combined`, URI and Referer replaced,
# plus request/upstream timing and upstream status at the end: for overlay
# requests these replace error-level details the error log no longer gets.
log_format prereborn_masked '$remote_addr - $remote_user [$time_local] '
    '"$request_method $prereborn_log_path$prereborn_log_args $server_protocol" $status $body_bytes_sent '
    '"$prereborn_log_referer" "$http_user_agent" '
    'rt=$request_time us=$upstream_status urt=$upstream_response_time';
