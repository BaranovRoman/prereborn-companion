# WK-196 - masked access log format for prereborn.ru.
#
# http-level file: map/log_format are not allowed inside `server {}`, so this
# can't live in the ISPmanager vhost field (nginx.production.conf). Install as
# /etc/nginx/conf.d/prereborn-logging.conf - see docs/production-deployment.md
# "Logs and retention".
#
# What is masked:
# - publicToken in /overlay/<token> and /api/stream/overlay/<token> - the
#   overlay polls these constantly and the token is valid until reissued;
# - the whole query string of /api/stream/integrations/*/callback - OAuth
#   code/state (Twitch, DonationAlerts) and openid.* (Steam ID) for Steam;
# - the same in Referer: the overlay page's own requests carry
#   https://prereborn.ru/overlay/<token> as Referer.
# Overlay query strings are dropped as well - nothing there is needed for
# diagnostics.

map $request_uri $prereborn_log_uri {
    default $request_uri;
    "~^(?<prereborn_ov_prefix>/(?:api/stream/)?overlay/)[^/?]+(?<prereborn_ov_rest>[^?]*)" "${prereborn_ov_prefix}[token]${prereborn_ov_rest}";
    "~^(?<prereborn_cb_path>/api/stream/integrations/[^/?]+/callback)\?" "${prereborn_cb_path}?[redacted]";
}

map $http_referer $prereborn_log_referer {
    default $http_referer;
    "" "-";
    "~^(?<prereborn_ref_ov>https?://[^/]+/(?:api/stream/)?overlay/)[^/?]+" "${prereborn_ref_ov}[token]";
    "~^(?<prereborn_ref_cb>https?://[^/]+/api/stream/integrations/[^/?]+/callback)\?" "${prereborn_ref_cb}?[redacted]";
}

# Same fields and order as nginx's built-in `combined`, only URI and Referer
# replaced.
log_format prereborn_masked '$remote_addr - $remote_user [$time_local] '
    '"$request_method $prereborn_log_uri $server_protocol" $status $body_bytes_sent '
    '"$prereborn_log_referer" "$http_user_agent"';
