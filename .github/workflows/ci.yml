name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prereborn
          POSTGRES_PASSWORD: prereborn
          POSTGRES_DB: prereborn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prereborn -d prereborn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prereborn:prereborn@localhost:5432/prereborn_test
      STREAM_JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-companion-release-contract.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Russian user-facing changelog: format of every file plus an entry for
      # each plugin's manifest version (changelog/README.md).
      - run: node --test scripts/changelog.test.mjs
      - run: node scripts/changelog.mjs check
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prereborn/api db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @prereborn/companion test
      - run: pnpm --filter @prereborn/web exec playwright install --with-deps chromium
      - run: pnpm --filter @prereborn/web test:e2e

  # WK-183 - the PUBG plugin package: worker (unit, manifest, real-process
  # IPC), the manager's install defaults, packaging tool and UI/widget. The
  # Windows release build of the same crate runs in windows-release.yml.
  pubg-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins
      - run: cargo test --locked --manifest-path plugins/Cargo.toml -p companion-pubg-plugin
      - run: cargo test --locked --manifest-path plugins/Cargo.toml -p companion-plugin-manager --lib
      - run: python3 -m unittest discover -s plugins/tools/tests
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prereborn/pubg-ui test
      - run: pnpm --filter @prereborn/pubg-ui build
