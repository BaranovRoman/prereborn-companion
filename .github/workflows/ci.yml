name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prereborn
          POSTGRES_PASSWORD: prereborn
          POSTGRES_DB: prereborn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prereborn -d prereborn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://prereborn:prereborn@localhost:5432/prereborn_test
      STREAM_JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-companion-release-contract.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prereborn/api db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @prereborn/web exec playwright install --with-deps chromium
      - run: pnpm --filter @prereborn/web test:e2e
