name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: prereborn-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WK-88 - resolves the current production Companion download URL +
      # version from GitHub's "latest release" instead of a hardcoded tag,
      # so this file never needs a manual edit after a Companion release.
      # See scripts/resolve-companion-release.sh for the full contract.
      - name: Resolve latest Companion release (download URL + version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/resolve-companion-release.sh

      # WK-80 - production stops building entirely: the artifact is built
      # here, on the GitHub-hosted runner, and only its compiled output is
      # shipped to the server. See docs/research/wk-80-build-outside-production.md.
      # These NEXT_PUBLIC_* values are the only build-time inputs
      # `next build` needs (get inlined into the client bundle) - none are
      # secret (verified: public URLs only), so this step needs zero
      # GitHub secrets.
      - name: Build release artifact
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SITE_URL: https://prereborn.ru
          NEXT_PUBLIC_MEDIA_BASE_URL: https://prereborn.ru/media
          NEXT_PUBLIC_DOTA_COMPANION_DOWNLOAD_URL: ${{ env.COMPANION_DOWNLOAD_URL }}
          NEXT_PUBLIC_DOTA_COMPANION_VERSION: ${{ env.COMPANION_VERSION }}
        run: bash scripts/build-release-artifact.sh artifact-out "${{ github.event.workflow_run.head_sha }}"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure release infrastructure exists
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /var/www/www-root/data/www/prereborn.ru/releases \
               /var/www/www-root/data/www/prereborn.ru/shared/logs \
               /var/www/www-root/data/www/prereborn.ru/apps/api/uploads \
               /var/www/www-root/data/www/prereborn.ru/incoming'

      - name: Upload artifact and release script
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -P "$SSH_PORT" \
            artifact-out/release.tar.gz artifact-out/release.tar.gz.sha256 release.sh \
            "$SSH_USER@$SSH_HOST:/var/www/www-root/data/www/prereborn.ru/incoming/"

      - name: Install production environment
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          STREAM_JWT_SECRET: ${{ secrets.PRODUCTION_STREAM_JWT_SECRET }}
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DONATION_ALERTS_CLIENT_ID: ${{ secrets.DONATION_ALERTS_CLIENT_ID }}
          DONATION_ALERTS_CLIENT_SECRET: ${{ secrets.DONATION_ALERTS_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          test -n "$DATABASE_URL" || {
            echo "PRODUCTION_DATABASE_URL is empty"
            exit 1
          }
          test -n "$STREAM_JWT_SECRET" || {
            echo "PRODUCTION_STREAM_JWT_SECRET is empty"
            exit 1
          }
          test -n "$TWITCH_CLIENT_ID" || {
            echo "TWITCH_CLIENT_ID is empty"
            exit 1
          }
          test -n "$TWITCH_CLIENT_SECRET" || {
            echo "TWITCH_CLIENT_SECRET is empty"
            exit 1
          }
          test -n "$DONATION_ALERTS_CLIENT_ID" || {
            echo "DONATION_ALERTS_CLIENT_ID is empty"
            exit 1
          }
          test -n "$DONATION_ALERTS_CLIENT_SECRET" || {
            echo "DONATION_ALERTS_CLIENT_SECRET is empty"
            exit 1
          }

          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'PORT=5102\n'
            printf 'NODE_ENV=production\n'
            printf 'STREAM_JWT_SECRET=%s\n' "$STREAM_JWT_SECRET"
            # Optional: empty allowlist just means the admin panel is unreachable,
            # never a startup failure - see apps/api/src/config/env.ts.
            printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS"
            printf 'CORS_ALLOWED_ORIGINS=https://prereborn.ru,https://www.prereborn.ru\n'
            printf 'STEAM_OPENID_REALM=https://prereborn.ru\n'
            printf 'STEAM_OPENID_RETURN_URL=https://prereborn.ru/api/stream/integrations/steam/callback\n'
            printf 'OPENDOTA_API_KEY=%s\n' "$OPENDOTA_API_KEY"
            printf 'TWITCH_CLIENT_ID=%s\n' "$TWITCH_CLIENT_ID"
            printf 'TWITCH_CLIENT_SECRET=%s\n' "$TWITCH_CLIENT_SECRET"
            printf 'TWITCH_REDIRECT_URI=https://prereborn.ru/api/stream/integrations/twitch/callback\n'
            printf 'TWITCH_FRONTEND_ORIGIN=https://prereborn.ru\n'
            printf 'DONATION_ALERTS_CLIENT_ID=%s\n' "$DONATION_ALERTS_CLIENT_ID"
            printf 'DONATION_ALERTS_CLIENT_SECRET=%s\n' "$DONATION_ALERTS_CLIENT_SECRET"
            printf 'DONATION_ALERTS_REDIRECT_URI=https://prereborn.ru/api/stream/integrations/donation-alerts/callback\n'
            printf 'DONATION_ALERTS_FRONTEND_ORIGIN=https://prereborn.ru\n'
            printf 'BACKEND_URL=http://127.0.0.1:5102\n'
            # WK-80 - fixed, non-versioned uploads location; must never live
            # inside a `releases/<sha>/` directory (see apps/api/src/config/env.ts).
            # Deliberately the SAME absolute path nginx.production.conf's
            # /uploads/ alias already points at (unchanged by this migration)
            # and where uploads already lived before WK-80 - not moved under
            # shared/, so no nginx config change and no data migration are
            # needed for existing uploaded files to keep resolving.
            printf 'UPLOADS_DIR=/var/www/www-root/data/www/prereborn.ru/apps/api/uploads\n'
            printf 'NEXT_PUBLIC_API_URL=/api\n'
            printf 'NEXT_PUBLIC_SITE_URL=https://prereborn.ru\n'
            printf 'NEXT_PUBLIC_MEDIA_BASE_URL=https://prereborn.ru/media\n'
            # WK-88 - NEXT_PUBLIC_DOTA_COMPANION_DOWNLOAD_URL/_VERSION are
            # deliberately NOT written here: NEXT_PUBLIC_* values are
            # inlined into the client bundle at build time (see the "Build
            # release artifact" step above), so a runtime .env entry for
            # them has no effect - writing one here would just be a second,
            # driftable copy of the same value.
          } | \
            ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              'umask 077; cat > /var/www/www-root/data/www/prereborn.ru/shared/.env'

      # WK-80 - production only extracts, migrates, atomically switches, and
      # reloads PM2. No `pnpm install`, `next build`, or `tsc` ever runs
      # here anymore - see release.sh for the full extract/verify/migrate/
      # switch/health-check/rollback sequence (dry-run tested locally via
      # scripts/test-release-sh.sh before this workflow existed).
      - name: Release (extract, migrate, switch, reload, health-check)
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd /var/www/www-root/data/www/prereborn.ru && bash incoming/release.sh '${{ github.event.workflow_run.head_sha }}' incoming/release.tar.gz"

      - name: Verify public endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 \
            https://prereborn.ru/api/health
