name: Spike - libpiper Windows build (WK-74)

# Manual-only, temporary verification job for the WK-74 local-TTS spike:
# does OHF-Voice/piper1-gpl's libpiper (C API, GPL-3.0) build reproducibly
# on a clean windows-latest runner, with no Python runtime involved, and
# produce a working standalone CLI + DLLs we could ship as a Companion
# sidecar? See docs/research/local-tts-licensing.md for why this
# architecture (separate process, not linked into Companion) was chosen.
#
# Not wired into the real release pipeline (windows-release.yml) - this is
# throwaway verification only, safe to delete once the spike is recorded.

on:
  workflow_dispatch:

jobs:
  build-libpiper:
    runs-on: windows-latest
    steps:
      - name: Checkout piper1-gpl (pinned to v1.7.0) into a short path
        shell: cmd
        run: |
          git clone --depth 1 --branch v1.7.0 https://github.com/OHF-Voice/piper1-gpl.git C:\pb\piper1-gpl

      # Local reproduction of this spike hit MAX_PATH (260 char) failures
      # during espeak-ng's own git clone / CMake object-file paths when
      # built from a long path - checking out to C:\pb sidesteps that.
      # Recorded here either way, whether or not it turns out to be needed
      # on this runner's default (shorter) workspace path.
      - name: Record environment
        shell: pwsh
        run: |
          cmake --version
          ninja --version 2>$null
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          git -C C:\pb\piper1-gpl log -1 --format="%H %ci"

      - name: Configure + build + install libpiper (Release)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSPATH=%%i
          if not defined VSPATH (
            echo Could not locate a Visual Studio installation via vswhere
            exit /b 1
          )
          echo Using VS install: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 (
            echo vcvarsall.bat failed
            exit /b 1
          )
          where cl
          if errorlevel 1 (
            echo cl.exe not on PATH after vcvarsall - aborting rather than silently falling back to another compiler
            exit /b 1
          )
          cd /d C:\pb\piper1-gpl\libpiper
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=%CD%\install
          if errorlevel 1 exit /b 1
          cmake --build build --config Release
          if errorlevel 1 exit /b 1
          cmake --install build --config Release
          if errorlevel 1 exit /b 1

      - name: Co-locate DLLs with the CLI (Windows loader needs same dir or PATH)
        shell: pwsh
        run: |
          Copy-Item C:\pb\piper1-gpl\libpiper\install\lib\piper.dll C:\pb\piper1-gpl\libpiper\install\bin\
          Copy-Item C:\pb\piper1-gpl\libpiper\install\lib\onnxruntime.dll C:\pb\piper1-gpl\libpiper\install\bin\
          Copy-Item C:\pb\piper1-gpl\libpiper\install\lib\onnxruntime_providers_shared.dll C:\pb\piper1-gpl\libpiper\install\bin\

      - name: Download ru_RU-denis-medium voice (MIT model / CC0 dataset - see local-tts-licensing.md)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/denis/medium/ru_RU-denis-medium.onnx" -OutFile C:\pb\ru_RU-denis-medium.onnx
          Invoke-WebRequest -Uri "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/denis/medium/ru_RU-denis-medium.onnx.json" -OutFile C:\pb\ru_RU-denis-medium.onnx.json

      - name: Smoke test - synthesize a short Russian phrase
        shell: pwsh
        run: |
          $exe = "C:\pb\piper1-gpl\libpiper\install\bin\piper_exe.exe"
          $espeakData = "C:\pb\piper1-gpl\libpiper\install\share\espeak-ng-data"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "piper_exe --help failed with $LASTEXITCODE" }
          "Привет стример, как дела в игре сегодня?" | & $exe --model C:\pb\ru_RU-denis-medium.onnx --espeak_data $espeakData --output_file C:\pb\smoke.wav
          if ($LASTEXITCODE -ne 0) { throw "synthesis failed with $LASTEXITCODE" }
          $wav = Get-Item C:\pb\smoke.wav
          if ($wav.Length -lt 1000) { throw "output wav is suspiciously small: $($wav.Length) bytes" }
          Write-Host "Smoke test OK - wav size: $($wav.Length) bytes"

      - name: Report artifact sizes
        shell: pwsh
        run: |
          $bin = "C:\pb\piper1-gpl\libpiper\install\bin"
          Get-ChildItem $bin | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}
          $espeakData = "C:\pb\piper1-gpl\libpiper\install\share\espeak-ng-data"
          $espeakSize = (Get-ChildItem $espeakData -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("espeak-ng-data total: {0:N1} MB" -f ($espeakSize / 1MB))
          $totalBin = (Get-ChildItem $bin -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("bin/ total (redistributable, no .pdb): {0:N1} MB" -f ($totalBin / 1MB))

      - name: Upload spike artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libpiper-windows-spike
          path: |
            C:\pb\piper1-gpl\libpiper\install\bin\*.exe
            C:\pb\piper1-gpl\libpiper\install\bin\*.dll
            C:\pb\piper1-gpl\libpiper\install\include\piper.h
            C:\pb\smoke.wav
          if-no-files-found: error
