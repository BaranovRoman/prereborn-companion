name: PreReborn Companion - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "prereborn-v*"
    paths:
      - "apps/companion/**"
      - ".github/workflows/windows-release.yml"

jobs:
  # Plain CI build - branch pushes / manual dispatch. Uploads a short-lived
  # Actions artifact for quick local inspection, NOT meant for public
  # distribution (Actions artifacts require a GitHub login and expire - see
  # release-windows below for the actual public download source).
  build-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Build Tauri app (Windows installer)
        run: pnpm --filter @prereborn/companion exec tauri build --bundles nsis

      - name: Smoke test (launch built binary, verify GSI server comes up)
        shell: powershell
        run: ./scripts/companion-smoke-test.ps1

      - name: Generate checksums
        shell: powershell
        run: ./scripts/companion-checksums.ps1

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prereborn-companion-windows
          path: |
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error

  # Tag-triggered release - tag format: prereborn-vX.Y.Z (e.g.
  # prereborn-v0.2.1). Patches the version in package.json/tauri.conf.json
  # from the tag BEFORE building, so the bundle filename
  # (dota-companion_X.Y.Z_x64-setup.exe) always matches the tag - no manual
  # version-bump commit required before tagging. Publishes/updates a GitHub
  # Release and attaches the installer(s). WK-88's
  # companion-verify-release-assets.ps1 gate (below) ensures a release only
  # becomes GitHub's public "latest" when it's actually complete -
  # scripts/resolve-companion-release.sh then picks that up automatically
  # for the web download link at web build time, no manual URL edit needed.
  release-windows:
    if: startsWith(github.ref, 'refs/tags/prereborn-v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#prereborn-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Patch package.json / tauri.conf.json / Cargo.toml version from tag
        shell: bash
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          jq --arg v "$version" '.version = $v' apps/companion/package.json > tmp.json
          mv tmp.json apps/companion/package.json
          jq --arg v "$version" '.version = $v' apps/companion/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/companion/src-tauri/tauri.conf.json
          # Cargo.toml isn't JSON - patch only the first `version = "..."` line,
          # which is the [package] version (dependency version strings below it
          # look different, e.g. `tauri = { version = "2", ... }`). This also
          # feeds env!("CARGO_PKG_VERSION") (state.rs::COMPANION_VERSION), sent
          # to the backend and into diagnostics exports - it must match the
          # tag/installer version too, not just the two JSON files above.
          sed -i '0,/^version = /s/^version = ".*"/version = "'"$version"'"/' apps/companion/src-tauri/Cargo.toml

      - name: Build Tauri app (Windows installer)
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Updater artifacts (signed .sig next to the installer, consumed by
          # the in-app updater's endpoint - see WK-70) only get produced once
          # a signing key exists. Until TAURI_SIGNING_PRIVATE_KEY is added as
          # a repo secret, this is a no-op and the release keeps working
          # exactly as before.
          $extraArgs = ""
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            # `pnpm exec` runs the tauri CLI with cwd = apps/companion, not
            # this step's cwd (repo root) - a relative --config path here
            # silently resolved against the wrong directory and failed with
            # "cannot find the file specified" (see prereborn-v0.5.0's
            # failed build log). Absolute path avoids the mismatch; GitHub
            # Actions runner paths never contain spaces, so no quoting is
            # needed through the cmd.exe wrapper below.
            $configPath = Join-Path (Get-Location) "updater-config.json"
            '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Path $configPath -Encoding ascii
            $extraArgs = " --config $configPath"
          }
          cmd.exe /d /s /c "pnpm.cmd --filter @prereborn/companion exec tauri build --bundles nsis$extraArgs > tauri-build.log 2>&1"
          $buildExitCode = $LASTEXITCODE
          Get-Content tauri-build.log
          exit $buildExitCode

      # WK-88 - a build failure must NEVER produce a public, non-draft
      # GitHub Release. This used to publish one via softprops/action-gh-
      # release (draft: false, no installer attached) - since GitHub's
      # "latest release" resolution only excludes draft/prerelease, that
      # fictitious release could become `/releases/latest/`, which both the
      # Tauri updater (tauri.conf.json) and web's download-URL resolver
      # (scripts/resolve-companion-release.sh) trust. Confirmed this
      # actually happened in production: prereborn-v0.5.0's failed build
      # was published as a real, non-draft, non-prerelease release for
      # ~20 minutes before v0.5.1 superseded it. Uploading as a workflow
      # artifact instead keeps the debug log available without touching
      # GitHub Releases at all.
      - name: Upload failed build log (debug artifact, not a public release)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: companion-build-failure-log-${{ steps.version.outputs.version }}
          path: tauri-build.log
          if-no-files-found: warn

      - name: Smoke test (launch built binary, verify GSI server comes up)
        shell: powershell
        run: ./scripts/companion-smoke-test.ps1

      - name: Generate checksums
        shell: powershell
        run: ./scripts/companion-checksums.ps1

      # WK-81 - builds the local Silero TTS sidecar Companion downloads on
      # first opt-in (apps/companion/src-tauri/src/silero.rs): a
      # self-contained Python 3.12 (embeddable package, not a venv - see
      # docs/research/wk-81-silero-tts-feasibility.md for why a venv isn't
      # redistributable) + PyTorch CPU + the sidecar script, plus the
      # v5_5_ru model as a separate asset. No toolchain setup needed here -
      # the script downloads its own portable Python. A hard step failure
      # like everything else in this job, not a silent skip. (WK-80 removed
      # the equivalent Piper build step that used to run here.)
      - name: Build + package Silero TTS runtime and model
        shell: powershell
        run: ./scripts/companion-build-silero-runtime.ps1

      - name: Generate updater manifest (latest.json)
        shell: powershell
        run: >-
          ./scripts/companion-generate-update-manifest.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Tag "${{ github.ref_name }}"
          -Repository "${{ github.repository }}"

      # WK-88 - gate before this release can ever become the public
      # "latest": requires installer + checksum + updater signature +
      # latest.json, and cross-checks latest.json's version against the
      # tag. Runs as its own step (not just `files:` globs below) so a
      # missing/inconsistent asset fails the job with a clear message
      # before any publish happens, instead of silently publishing a
      # partial release.
      - name: Verify release assets before publish
        shell: powershell
        run: >-
          ./scripts/companion-verify-release-assets.ps1
          -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PreReborn Companion ${{ steps.version.outputs.version }}"
          draft: false
          generate_release_notes: true
          # Belt-and-suspenders alongside the verification step above: if
          # any glob below ever matched zero files, fail loud instead of
          # publishing a release missing an asset the updater/web depend on.
          fail_on_unmatched_files: true
          files: |
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/release/bundle/nsis/*.sha256
            apps/companion/src-tauri/target/release/bundle/nsis/*.sig
            latest.json
            silero-dist/*.zip
            silero-dist/*.sha256
