name: PreReborn Companion - Windows

on:
  workflow_dispatch:
    inputs:
      validation_version:
        description: 'Optional stable X.Y.Z for unsigned Windows validation; never publishes or signs'
        required: false
        default: ''
        type: string
      signing_validation:
        description: 'Explicit approved signing rehearsal only; no GitHub Release or deploy'
        type: boolean
        default: false
      dota_candidate:
        description: 'Build standalone Windows Dota worker/UI candidate only; no signing or publication'
        type: boolean
        default: false
      dota_candidate_metadata:
        description: 'Optional PUBLIC signed candidate metadata for exact Windows install verification; never a private key'
        type: string
        default: ''
  # WK-145 - before this, build-windows only ran on workflow_dispatch or a
  # push to main/tags, so a PR touching apps/companion/src-tauri merged with
  # zero automated Rust build/test coverage (ci.yml only covers web/api).
  # Safe to trigger straight from pull_request (no fork-PR / secrets concern
  # here - build-windows never references TAURI_SIGNING_PRIVATE_KEY, only
  # release-windows does, and that job's tag-only `if` below is unaffected
  # by this). Same path filter as the push trigger below, since this job
  # builds the whole packaged app, not just the Rust crate.
  pull_request:
    paths:
      - "apps/companion/**"
      - ".github/workflows/windows-release.yml"
  push:
    branches:
      - main
    tags:
      - "prereborn-v*"
    paths:
      - "apps/companion/**"
      - ".github/workflows/windows-release.yml"

jobs:
  # Plain CI build - branch pushes / manual dispatch. Uploads a short-lived
  # Actions artifact for quick local inspection, NOT meant for public
  # distribution (Actions artifacts require a GitHub login and expire - see
  # release-windows below for the actual public download source).
  build-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.signing_validation && !inputs.dota_candidate }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      # WK-125 - the one place this repo's build touches a REAL OS credential
      # store (every secret-storage unit test uses an in-memory fake, see
      # storage/mod.rs and secure_storage.rs). Proves the `keyring`
      # dependency's Windows Credential Manager backend actually links and
      # round-trips on a real Windows runner, not just in the cross-platform
      # unit suite. Runs as a standalone `examples/` binary rather than a
      # `cargo test` - the same round trip run as an `#[ignore]`d unit test
      # inside the full `cargo test --lib` binary crashes on this runner
      # with STATUS_ENTRYPOINT_NOT_FOUND for reasons isolated to that
      # combined test-harness binary, not to `keyring` itself (see
      # examples/keyring_smoke.rs's doc comment). Uses a synthetic key/value
      # only.
      - name: Set stable validation metadata (manual unsigned build only)
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        shell: bash
        env:
          VALIDATION_VERSION: ${{ inputs.validation_version }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          version = os.environ['VALIDATION_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Stable X.Y.Z required')
          for name in ['apps/companion/package.json','apps/companion/src-tauri/tauri.conf.json']:
              p=pathlib.Path(name); data=json.loads(p.read_text()); data['version']=version
              p.write_text(json.dumps(data,indent=2)+'\n')
          p=pathlib.Path('apps/companion/src-tauri/Cargo.toml')
          p.write_text(re.sub(r'^version = "[^"]+"', 'version = "'+version+'"',p.read_text(),count=1,flags=re.M))
          PY

      - name: Windows process supervision tests
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        shell: bash
        timeout-minutes: 15
        run: |
          cargo test --manifest-path apps/companion/src-tauri/Cargo.toml --test windows_supervisor -- --test-threads=1
          cargo test --locked --manifest-path apps/companion/src-tauri/Cargo.toml --test plugin_transport -- --test-threads=1

      - name: Targeted plugin library, core shell and invoke tests
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        run: pnpm --filter @prereborn/companion exec vitest run src/pages/PluginsPage.test.tsx src/plugins/api.test.ts src/plugins/bridge.test.ts src/core/interface/CoreShell.test.tsx src/core/audio/useManagedPluginAudio.test.tsx src/hooks/useUpdater.test.tsx src/core/api.updater.test.ts

      - name: Independent installed plugin UI
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        run: |
          pnpm --filter @prereborn/dota-ui build
          pnpm --filter @prereborn/dota-ui exec vitest run src/App.test.tsx overlay/OverlayApp.test.tsx overlay/widgets/SessionWidget.test.tsx overlay/widgets/RecentMatchesWidget.test.tsx

      - name: Independent package GSI projection regressions
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        shell: bash
        timeout-minutes: 15
        run: cargo test --locked --manifest-path plugins/Cargo.toml -p companion-dota-domain projection::tests -- --test-threads=1

      - name: Relocated Dota SQLite and detector regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        shell: bash
        timeout-minutes: 15
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/companion/src-tauri/target
          COMPANION_TEST_PLUGIN_DIR: ${{ github.workspace }}/apps/companion/src-tauri/target/debug
        run: |
          cargo build --locked --manifest-path plugins/Cargo.toml -p companion-dota-plugin -p companion-hello-plugin
          cargo test --locked --manifest-path plugins/Cargo.toml -p companion-plugin-protocol
          cargo test --locked --manifest-path plugins/Cargo.toml -p companion-hello-plugin --test ipc
          cargo test --locked --manifest-path plugins/Cargo.toml -p companion-dota-plugin --lib
          cargo test --locked --manifest-path plugins/Cargo.toml -p companion-dota-plugin --test ipc -- --test-threads=1
          # Keep the existing disk-latency assertions meaningful: do not run
          # 140 SQLite/WAL fixtures concurrently against the runner's disk.
          cargo test --locked --manifest-path plugins/Cargo.toml -p companion-dota-storage -- --test-threads=1

      - name: Secure storage smoke test (real Windows Credential Manager)
        run: cargo run --manifest-path apps/companion/src-tauri/Cargo.toml --example keyring_smoke

      - name: Build Tauri app (Windows installer)
        shell: powershell
        run: |
          # Core contains no game renderer/worker. Silero is not rebuilt here.
          $configPath = Join-Path (Get-Location) "validation-build-config.json"
          '{"build":{"beforeBuildCommand":"pnpm.cmd exec tsc && pnpm.cmd exec vite build"}}' | Set-Content $configPath -Encoding ascii
          & pnpm.cmd --filter @prereborn/companion exec tauri build --bundles nsis --config $configPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify stable validation bundle metadata and contents
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        shell: powershell
        run: ./scripts/companion-verify-windows-bundle.ps1 -Version "${{ inputs.validation_version }}"

      - name: Smoke test (plugin-free core and single instance)
        shell: powershell
        run: ./scripts/companion-smoke-test.ps1

      - name: Durable eight-hour transport budget (actual SQLite commits)
        if: github.event_name == 'workflow_dispatch' && inputs.validation_version != ''
        shell: bash
        timeout-minutes: 60
        run: cargo test --locked --manifest-path apps/companion/src-tauri/Cargo.toml --test plugin_transport store::tests::eight_hour_transport_budget_uses_actual_admission_ack_and_sqlite_receipts -- --exact --ignored --nocapture --test-threads=1

      - name: Generate checksums
        shell: powershell
        run: ./scripts/companion-checksums.ps1

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prereborn-companion-windows
          path: |
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error

      - name: Upload unsigned bundle verification failure evidence
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: companion-unsigned-verification-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/companion/src-tauri/target/release/dota-companion.exe
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/companion-installer-inspection/dota-companion.exe
            windows-installer-inventory.txt

  dota-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.dota_candidate && !inputs.signing_validation && github.ref == 'refs/heads/codex/plugin-runtime-prototype'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins
      - run: pnpm install --frozen-lockfile
        env:
          CI: true
      - name: Build independent Dota executable
        shell: bash
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path plugins/Cargo.toml -p companion-dota-plugin
      - name: Existing real-process IPC tests
        shell: bash
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --manifest-path plugins/Cargo.toml -p companion-dota-plugin --test ipc -- --test-threads=1
      - name: Build independent UI and overlay assets
        shell: bash
        run: pnpm --filter @prereborn/dota-ui build
      - name: Inspect native dependencies and stage exact independent artifacts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, struct, shutil
          binary=pathlib.Path('plugins/target/x86_64-pc-windows-msvc/release/companion-dota-plugin.exe')
          b=binary.read_bytes(); pe=struct.unpack_from('<I',b,0x3c)[0]; opt=pe+24
          if b[pe:pe+4]!=b'PE\0\0' or struct.unpack_from('<H',b,opt)[0]!=0x20b: raise SystemExit('Expected PE64')
          n=struct.unpack_from('<H',b,pe+6)[0]; size=struct.unpack_from('<H',b,pe+20)[0]; sections=[]
          for i in range(n):
            p=opt+size+i*40; vs,va,rs,rp=struct.unpack_from('<IIII',b,p+8); sections.append((va,max(vs,rs),rp))
          def offset(rva):
            for va,length,rp in sections:
              if va<=rva<va+length: return rp+rva-va
            raise ValueError('Unmapped PE RVA')
          p=offset(struct.unpack_from('<I',b,opt+120)[0]); imports=[]
          while any(struct.unpack_from('<IIIII',b,p)):
            name=offset(struct.unpack_from('<I',b,p+12)[0]); imports.append(b[name:b.index(0,name)].decode()); p+=20
          print('Independent worker imports:', ', '.join(imports))
          if any(d.lower().startswith(('vcruntime','msvcp','msvcr','api-ms-win-crt')) or d.lower()=='ucrtbase.dll' for d in imports): raise SystemExit('Unexpected redistributable dependency')
          target=pathlib.Path('dota-artifact/target/release'); target.mkdir(parents=True)
          shutil.copy2(binary,target/binary.name)
          shutil.copytree('plugins/dota/ui/dist','dota-artifact/dota/ui/dist')
          PY
      - name: Verify exact official signed package and catalog on Windows
        if: inputs.dota_candidate_metadata != ''
        shell: bash
        env:
          PUBLIC_METADATA: ${{ inputs.dota_candidate_metadata }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          raw=os.environ['PUBLIC_METADATA']
          if len(raw.encode())>61440: raise SystemExit('Candidate metadata too large')
          meta=json.loads(raw); source=str(meta['source_run'])
          if not source.isdigit(): raise SystemExit('Invalid source run')
          pathlib.Path('dota-public-metadata.json').write_text(raw,encoding='utf-8')
          subprocess.run(['gh','run','download',source,'--repo',os.environ['GITHUB_REPOSITORY'],'--name','dota-windows-candidate','--dir','dota-exact-source'],check=True)
          PY
          python plugins/tools/package.py assemble --input-root dota-exact-source --metadata dota-public-metadata.json --output dota-signed-candidate
          cargo run --locked --release --manifest-path plugins/Cargo.toml -p companion-plugin-manager --example verify_candidate -- dota-signed-candidate/dota2-0.1.0-windows-x86_64.zip dota-signed-candidate/dota2-0.1.0-windows-x86_64.release.json dota-signed-candidate/catalog.json dota-signed-candidate/catalog.minisig
      - name: Upload verified signed staging candidate (no release/catalog publication)
        if: inputs.dota_candidate_metadata != ''
        uses: actions/upload-artifact@v4
        with:
          name: verified-dota-windows-candidate
          retention-days: 14
          if-no-files-found: error
          path: dota-signed-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: dota-windows-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            dota-artifact/

  # Tag-triggered release - tag format: prereborn-vX.Y.Z (e.g.
  # prereborn-v0.2.1). Patches the version in package.json/tauri.conf.json
  # from the tag BEFORE building, so the bundle filename
  # (dota-companion_X.Y.Z_x64-setup.exe) always matches the tag - no manual
  # version-bump commit required before tagging. Publishes/updates a GitHub
  # Release and attaches the installer(s). WK-88's
  # companion-verify-release-assets.ps1 gate (below) ensures a release only
  # becomes GitHub's public "latest" when it's actually complete -
  # scripts/resolve-companion-release.sh then picks that up automatically
  # for the web download link at web build time, no manual URL edit needed.
  release-windows:
    concurrency:
      group: companion-stable-release
      cancel-in-progress: false
    if: ${{ !inputs.dota_candidate && ((startsWith(github.ref, 'refs/tags/prereborn-v') && !(github.event_name == 'workflow_dispatch' && inputs.validation_version != '')) || (github.event_name == 'workflow_dispatch' && inputs.signing_validation && inputs.validation_version != '' && github.ref == 'refs/heads/codex/plugin-runtime-prototype')) }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Derive version from tag
        id: version
        shell: bash
        env:
          VALIDATION_VERSION: ${{ inputs.validation_version }}
        run: |
          version="${GITHUB_REF_NAME#prereborn-v}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$VALIDATION_VERSION" ]]; then
            version="$VALIDATION_VERSION"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable X.Y.Z tag required; refusing prerelease/channel publication" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=prereborn-v$version" >> "$GITHUB_OUTPUT"

      - name: Patch package.json / tauri.conf.json / Cargo.toml version from tag
        shell: bash
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          jq --arg v "$version" '.version = $v' apps/companion/package.json > tmp.json
          mv tmp.json apps/companion/package.json
          jq --arg v "$version" '.version = $v' apps/companion/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/companion/src-tauri/tauri.conf.json
          # Cargo.toml isn't JSON - patch only the first `version = "..."` line,
          # which is the [package] version (dependency version strings below it
          # look different, e.g. `tauri = { version = "2", ... }`). This also
          # feeds env!("CARGO_PKG_VERSION") (state.rs::COMPANION_VERSION), sent
          # to the backend and into diagnostics exports - it must match the
          # tag/installer version too, not just the two JSON files above.
          sed -i '0,/^version = /s/^version = ".*"/version = "'"$version"'"/' apps/companion/src-tauri/Cargo.toml

      # WK-125 - same real-Windows-Credential-Manager gate as build-windows
      # above (see its comment for why this runs as a standalone example
      # rather than a `cargo test`), run here too since this is the job that
      # actually produces a production release.
      - name: Secure storage smoke test (real Windows Credential Manager)
        run: cargo run --manifest-path apps/companion/src-tauri/Cargo.toml --example keyring_smoke

      - name: Build Tauri app (Windows installer)
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Updater artifacts (signed .sig next to the installer, consumed by
          # the in-app updater's endpoint - see WK-70) only get produced once
          # a signing key exists. Until TAURI_SIGNING_PRIVATE_KEY is added as
          # a repo secret, this is a no-op and the release keeps working
          # exactly as before.
          $extraArgs = ""
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            # `pnpm exec` runs the tauri CLI with cwd = apps/companion, not
            # this step's cwd (repo root) - a relative --config path here
            # silently resolved against the wrong directory and failed with
            # "cannot find the file specified" (see prereborn-v0.5.0's
            # failed build log). Absolute path avoids the mismatch; GitHub
            # Actions runner paths never contain spaces, so no quoting is
            # needed through the cmd.exe wrapper below.
            $configPath = Join-Path (Get-Location) "updater-config.json"
            '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Path $configPath -Encoding ascii
            $extraArgs = " --config $configPath"
          }
          cmd.exe /d /s /c "pnpm.cmd --filter @prereborn/companion exec tauri build --bundles nsis$extraArgs > tauri-build.log 2>&1"
          $buildExitCode = $LASTEXITCODE
          Get-Content tauri-build.log
          exit $buildExitCode

      # WK-88 - a build failure must NEVER produce a public, non-draft
      # GitHub Release. This used to publish one via softprops/action-gh-
      # release (draft: false, no installer attached) - since GitHub's
      # "latest release" resolution only excludes draft/prerelease, that
      # fictitious release could become `/releases/latest/`, which both the
      # Tauri updater (tauri.conf.json) and web's download-URL resolver
      # (scripts/resolve-companion-release.sh) trust. Confirmed this
      # actually happened in production: prereborn-v0.5.0's failed build
      # was published as a real, non-draft, non-prerelease release for
      # ~20 minutes before v0.5.1 superseded it. Uploading as a workflow
      # artifact instead keeps the debug log available without touching
      # GitHub Releases at all.
      - name: Upload failed build log (debug artifact, not a public release)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: companion-build-failure-log-${{ steps.version.outputs.version }}
          path: tauri-build.log
          if-no-files-found: warn

      - name: Verify stable release bundle metadata and contents
        shell: powershell
        run: ./scripts/companion-verify-windows-bundle.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Smoke test (plugin-free core and single instance)
        shell: powershell
        run: ./scripts/companion-smoke-test.ps1

      - name: Generate checksums
        shell: powershell
        run: ./scripts/companion-checksums.ps1

      # WK-81 - builds the local Silero TTS sidecar Companion downloads on
      # first opt-in (apps/companion/src-tauri/src/silero.rs): a
      # self-contained Python 3.12 (embeddable package, not a venv - see
      # docs/research/wk-81-silero-tts-feasibility.md for why a venv isn't
      # redistributable) + PyTorch CPU + the sidecar script, plus the
      # v5_5_ru model as a separate asset. No toolchain setup needed here -
      # the script downloads its own portable Python. A hard step failure
      # like everything else in this job, not a silent skip. (WK-80 removed
      # the equivalent Piper build step that used to run here.)
      - name: Build + package Silero TTS runtime and model
        shell: powershell
        run: ./scripts/companion-build-silero-runtime.ps1

      - name: Generate updater manifest (latest.json)
        shell: powershell
        run: >-
          ./scripts/companion-generate-update-manifest.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Tag "${{ steps.version.outputs.tag }}"
          -Repository "${{ github.repository }}"

      # WK-88 - gate before this release can ever become the public
      # "latest": requires installer + checksum + updater signature +
      # latest.json, and cross-checks latest.json's version against the
      # tag. Runs as its own step (not just `files:` globs below) so a
      # missing/inconsistent asset fails the job with a clear message
      # before any publish happens, instead of silently publishing a
      # partial release.
      - name: Verify updater signature with shipped public key and exact metadata
        shell: powershell
        run: |
          $installers = @(Get-ChildItem apps/companion/src-tauri/target/release/bundle/nsis -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Exactly one updater installer required" }
          $installerPath = $installers[0].FullName
          $stable = Invoke-RestMethod -Uri "https://github.com/BaranovRoman/prereborn-companion/releases/latest/download/latest.json" -TimeoutSec 30
          & cargo run --manifest-path apps/companion/src-tauri/Cargo.toml --example verify_updater_release -- $installerPath latest.json apps/companion/src-tauri/tauri.conf.json "${{ steps.version.outputs.version }}" $stable.version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified signing rehearsal (no publication)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: companion-stable-signing-validation-${{ steps.version.outputs.version }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/release/bundle/nsis/*.sha256
            apps/companion/src-tauri/target/release/bundle/nsis/*.sig
            latest.json

      - name: Verify release assets before publish
        shell: powershell
        run: >-
          ./scripts/companion-verify-release-assets.ps1
          -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/prereborn-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PreReborn Companion ${{ steps.version.outputs.version }}"
          draft: false
          generate_release_notes: true
          # Belt-and-suspenders alongside the verification step above: if
          # any glob below ever matched zero files, fail loud instead of
          # publishing a release missing an asset the updater/web depend on.
          fail_on_unmatched_files: true
          files: |
            apps/companion/src-tauri/target/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/release/bundle/nsis/*.sha256
            apps/companion/src-tauri/target/release/bundle/nsis/*.sig
            latest.json
            silero-dist/*.zip
            silero-dist/*.sha256

      # WK-88 - notifies deploy-production.yml so the web download link
      # (scripts/resolve-companion-release.sh) picks up this release
      # immediately, instead of waiting for the next unrelated web/api
      # deploy. Only reached if every step above (including the asset
      # verification gate) succeeded, so this never fires for a
      # failed/partial release. repository_dispatch is explicitly exempt
      # from GITHUB_TOKEN's push/PR loop-prevention restriction and is
      # documented to work for exactly this kind of cross-workflow signal.
      - name: Notify production deploy of the new release
        if: startsWith(github.ref, 'refs/tags/prereborn-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=companion-released
