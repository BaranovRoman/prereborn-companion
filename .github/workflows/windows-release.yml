name: PreReborn Companion - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "prereborn-v*"
    paths:
      - "apps/companion/**"
      - ".github/workflows/windows-release.yml"

jobs:
  # Plain CI build - branch pushes / manual dispatch. Uploads a short-lived
  # Actions artifact for quick local inspection, NOT meant for public
  # distribution (Actions artifacts require a GitHub login and expire - see
  # release-windows below for the actual public download source).
  build-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Build Tauri app (Windows installer)
        run: pnpm --filter @prereborn/companion run tauri build -- --bundles nsis

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prereborn-companion-windows
          path: apps/companion/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Tag-triggered release - tag format: prereborn-vX.Y.Z (e.g.
  # prereborn-v0.2.1). Patches the version in package.json/tauri.conf.json
  # from the tag BEFORE building, so the bundle filename
  # (dota-companion_X.Y.Z_x64-setup.exe) always matches the tag - no manual
  # version-bump commit required before tagging. Publishes/updates a GitHub
  # Release and attaches the installer(s) - this is the URL
  # NEXT_PUBLIC_DOTA_COMPANION_DOWNLOAD_URL on the site should point to (see
  # feature report for the exact "how to cut a release" steps).
  release-windows:
    if: startsWith(github.ref, 'refs/tags/prereborn-v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#prereborn-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Patch package.json / tauri.conf.json / Cargo.toml version from tag
        shell: bash
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          jq --arg v "$version" '.version = $v' apps/companion/package.json > tmp.json
          mv tmp.json apps/companion/package.json
          jq --arg v "$version" '.version = $v' apps/companion/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/companion/src-tauri/tauri.conf.json
          # Cargo.toml isn't JSON - patch only the first `version = "..."` line,
          # which is the [package] version (dependency version strings below it
          # look different, e.g. `tauri = { version = "2", ... }`). This also
          # feeds env!("CARGO_PKG_VERSION") (state.rs::COMPANION_VERSION), sent
          # to the backend and into diagnostics exports - it must match the
          # tag/installer version too, not just the two JSON files above.
          sed -i '0,/^version = /s/^version = ".*"/version = "'"$version"'"/' apps/companion/src-tauri/Cargo.toml

      - name: Build Tauri app (Windows installer)
        shell: powershell
        run: |
          pnpm --filter @prereborn/companion run tauri build -- --bundles nsis 2>&1 |
            Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publish failed build log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PreReborn Companion ${{ steps.version.outputs.version }} (build failed)"
          draft: false
          files: tauri-build.log

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PreReborn Companion ${{ steps.version.outputs.version }}"
          draft: false
          generate_release_notes: true
          files: apps/companion/src-tauri/target/release/bundle/nsis/*.exe
