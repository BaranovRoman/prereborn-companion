[package]
name = "companion-plugin-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
companion-plugin-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
minisign-verify = "0.2.5"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
