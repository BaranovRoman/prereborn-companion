[package]
name = "companion-pubg-plugin"
version = "0.1.2"
edition = "2021"

[dependencies]
companion-plugin-protocol = { path = "../protocol" }
companion-plugin-manager = { path = "../manager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }

[dev-dependencies]
tempfile = "3"

[features]
# Test-only: drives a real worker and its widget server without the Companion
# host (examples/widget_harness.rs, used by ui/e2e/widget.e2e.mjs).
harness = []

[[example]]
name = "widget_harness"
required-features = ["harness"]
