[package]
name = "companion-dota-storage"
version = "0.1.0"
edition = "2021"
[dependencies]
companion-plugin-protocol = { path = "../protocol" }
sha2 = "0.10"
companion-dota-domain = { path = "../dota-domain" }
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
[dev-dependencies]
tempfile = "3"
