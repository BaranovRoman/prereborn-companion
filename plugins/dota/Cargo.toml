[package]
name = "companion-dota-plugin"
version = "0.1.0"
edition = "2021"
[dependencies]
companion-plugin-protocol = { path = "../protocol" }
companion-dota-domain = { path = "../dota-domain" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
