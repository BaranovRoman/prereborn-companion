[package]
name = "companion-dota-plugin"
version = "0.2.3"
edition = "2021"
[dependencies]
companion-dota-storage = { path = "../dota-storage" }
rusqlite = { version = "0.31", features = ["bundled"] }
companion-plugin-protocol = { path = "../protocol" }
companion-plugin-manager = { path = "../manager" }
companion-dota-domain = { path = "../dota-domain" }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
global-hotkey = "0.8"
windows-sys = { version = "0.60.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
